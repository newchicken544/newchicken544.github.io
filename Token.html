<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stellar Token Refresher | Created by @chezz2413</title>
    <style>
        :root {
            --bg-color: #0b0a05;
            --card-bg: rgba(22, 19, 10, 0.75);
            --border-color: rgba(255, 215, 0, 0.2);
            --border-highlight: rgba(255, 215, 0, 0.4);
            --accent-glow: rgba(255, 215, 0, 0.4);
            --bloom-strong: rgba(255, 215, 0, 0.7);
            --accent-yellow: #ffd700;
            --accent-hover: #e6b800;
            --accent-amber: #ffaa00;
            --text-main: #fcf8e3;
            --text-muted: #a39b78;
            --danger: #ff4444;
            --discord-purple: #5865F2;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(255, 215, 0, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 170, 0, 0.05) 0%, transparent 50%);
            background-attachment: fixed;
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.15), 0 20px 40px rgba(0, 0, 0, 0.8);
        }

        /* Promo Banner Header */
        .promo-banner {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.1), rgba(88, 101, 242, 0.15));
            border: 1px solid var(--border-highlight);
            border-radius: 12px;
            padding: 14px 20px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.1);
        }

        .creator-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            color: var(--accent-yellow);
            text-shadow: 0 0 8px var(--accent-glow);
            font-size: 0.95rem;
        }

        .social-links {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .discord-btn {
            background: #5865F2;
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
            padding: 8px 16px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 0 12px rgba(88, 101, 242, 0.4);
        }

        .discord-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(88, 101, 242, 0.7);
            background: #4752C4;
        }

        header {
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--accent-yellow);
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: -0.5px;
            text-shadow: 0 0 10px var(--accent-glow);
        }

        .status-badge {
            font-size: 0.75rem;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 20px;
            background: rgba(255, 215, 0, 0.1);
            color: var(--accent-yellow);
            border: 1px solid var(--border-color);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 0 8px rgba(255, 215, 0, 0.2);
        }

        .status-badge.active {
            background: rgba(255, 215, 0, 0.2);
            color: #fff;
            border-color: var(--accent-yellow);
            box-shadow: 0 0 15px var(--bloom-strong);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        textarea {
            width: 100%;
            background: rgba(10, 10, 8, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 14px;
            color: #fff;
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
            font-size: 0.88rem;
            transition: all 0.3s ease;
            resize: vertical;
            white-space: pre-wrap;
            word-break: break-all;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent-yellow);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        /* Lifetime Visual Card & Dynamic Progress Bar */
        .lifetime-card {
            background: rgba(10, 10, 8, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
            box-shadow: inset 0 0 15px rgba(255, 215, 0, 0.03);
        }

        .lifetime-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .lifetime-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .lifetime-value {
            font-size: 1.25rem;
            font-weight: 700;
            font-family: 'SFMono-Regular', Consolas, monospace;
            color: var(--accent-yellow);
            text-shadow: 0 0 10px var(--accent-glow);
        }

        .progress-track {
            width: 100%;
            height: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            border: 1px solid rgba(255, 215, 0, 0.1);
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-amber), var(--accent-yellow));
            border-radius: 10px;
            transition: width 0.4s ease, background-color 0.4s ease;
            box-shadow: 0 0 12px var(--accent-yellow);
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            gap: 15px;
            flex-wrap: wrap;
        }

        .toggle-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            user-select: none;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 46px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(255, 255, 255, 0.1);
            transition: .3s;
            border-radius: 24px;
            border: 1px solid var(--border-color);
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background-color: var(--text-muted);
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: rgba(255, 215, 0, 0.2);
            border-color: var(--accent-yellow);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        input:checked + .slider:before {
            transform: translateX(22px);
            background-color: var(--accent-yellow);
            box-shadow: 0 0 8px var(--accent-yellow);
        }

        button.primary-btn {
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            color: #000;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        button.primary-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 0 25px var(--bloom-strong);
        }

        button.primary-btn:disabled {
            background: var(--border-color);
            color: var(--text-muted);
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 24px;
        }

        .metric-card {
            background: rgba(10, 10, 8, 0.5);
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: 10px;
        }

        .metric-card .title {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .metric-card .value {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--accent-yellow);
            font-family: 'SFMono-Regular', Consolas, monospace;
            word-break: break-all;
        }

        .output-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            background: rgba(255, 215, 0, 0.05);
            color: var(--accent-yellow);
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            font-size: 0.78rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .action-btn:hover {
            background: rgba(255, 215, 0, 0.15);
            border-color: var(--accent-yellow);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        /* Text Wrapping Preformatted JSON Output */
        pre {
            background: rgba(10, 10, 8, 0.9);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            overflow-x: auto;
            max-height: 250px;
            font-family: 'SFMono-Regular', Consolas, monospace;
            font-size: 0.85rem;
            color: #ffe680;
            white-space: pre-wrap;       /* CSS3 */
            white-space: -moz-pre-wrap;  /* Mozilla */
            white-space: -pre-wrap;      /* Opera 4-6 */
            white-space: -o-pre-wrap;    /* Opera 7 */
            word-wrap: break-word;       /* IE 5.5+ */
            word-break: break-all;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }

        .log {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 12px;
            min-height: 20px;
        }

        .log.error { 
            color: var(--danger); 
            text-shadow: 0 0 8px rgba(255, 69, 0, 0.4);
        }
        .log.success { 
            color: var(--accent-yellow); 
            text-shadow: 0 0 8px var(--accent-glow);
        }

        footer {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        footer a {
            color: var(--accent-yellow);
            text-decoration: none;
            font-weight: 600;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Promo & Social Banner -->
    <div class="promo-banner">
        <div class="creator-badge">
            <span>⚡ Developed by @chezz2413</span>
        </div>
        <div class="social-links">
            <a href="https://discord.gg/RVchTWxB9a" target="_blank" class="discord-btn">
                <svg width="18" height="14" viewBox="0 0 127.14 96.36" fill="currentColor">
                    <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a74.57,74.57,0,0,0,64.3,0c.87.68,1.76,1.36,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,45.92,53.87,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,45.92,96.1,53,91.08,65.69,84.69,65.69Z"/>
                </svg>
                Join Discord Server
            </a>
        </div>
    </div>

    <!-- Main Header -->
    <header>
        <h1>⚡ Stellar Refresher</h1>
        <span id="status-badge" class="status-badge">Idle</span>
    </header>

    <!-- Input Form -->
    <div class="form-group">
        <label for="refresh-token-input">Refresh Token / Bearer Token</label>
        <textarea id="refresh-token-input" rows="3" placeholder="Paste your refresh token or JWT bearer token here..."></textarea>
    </div>

    <!-- Dynamic Lifetime Card with Glowing Yellow Bar -->
    <div class="lifetime-card">
        <div class="lifetime-header">
            <span class="lifetime-title">Token Lifetime Remaining</span>
            <span id="lifetime-display" class="lifetime-value">-- : -- : --</span>
        </div>
        <div class="progress-track">
            <div id="lifetime-progress" class="progress-bar"></div>
        </div>
    </div>

    <!-- Controls & Auto-Refresh Toggle -->
    <div class="controls">
        <label class="toggle-wrapper">
            <div class="switch">
                <input type="checkbox" id="auto-refresh-toggle">
                <span class="slider"></span>
            </div>
            <span>Auto Refresh (at &le;2 mins remaining)</span>
        </label>

        <button id="refresh-btn" class="primary-btn" onclick="executeTokenRefresh()">Refresh Token</button>
    </div>

    <!-- Metrics Grid -->
    <div class="metrics-grid">
        <div class="metric-card">
            <div class="title">Output Lifetime</div>
            <div class="value" id="output-lifetime-display">N/A</div>
        </div>
        <div class="metric-card">
            <div class="title">Expiration Timestamp</div>
            <div class="value" id="expiration-display">N/A</div>
        </div>
        <div class="metric-card">
            <div class="title">Active Route</div>
            <div class="value" id="active-route-display">None</div>
        </div>
    </div>

    <!-- Response Output -->
    <div class="form-group">
        <div class="output-header">
            <label>JSON Response Payload</label>
            <div class="btn-group">
                <button class="action-btn" onclick="copyResponse()">Copy JSON</button>
                <button class="action-btn" onclick="downloadResponse()">Download JSON</button>
            </div>
        </div>
        <pre id="json-output">// Response payload will output here...</pre>
    </div>

    <div id="status-log" class="log"></div>

    <footer>
        Stellar Token Refresher &bull; Powered by <a href="https://discord.gg/RVchTWxB9a" target="_blank">@chezz2413 Community</a>
    </footer>
</div>

<script>
    const BASE_URL = "https://stellarapi-backend-production.up.railway.app";
    const ENDPOINTS = [
        "/auth/refresh",
        "/v1/auth/refresh",
        "/refresh",
        "/token/refresh"
    ];

    let timerInterval = null;
    let currentBearerToken = null;
    let tokenTotalDuration = 0;
    let currentPayloadObj = null;
    let isRefreshing = false;

    // Helper: Safely parse base64 JWT payload
    function parseJwt(token) {
        try {
            const base64Url = token.split('.')[1];
            if (!base64Url) return null;
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            const jsonPayload = decodeURIComponent(atob(base64).split('').map(c => {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        } catch (e) {
            return null;
        }
    }

    // Dynamic countdown timer and progress bar updater
    function startLifetimeTracker(expTimestamp, iatTimestamp) {
        clearInterval(timerInterval);

        const nowInitial = Math.floor(Date.now() / 1000);
        
        if (iatTimestamp && expTimestamp > iatTimestamp) {
            tokenTotalDuration = expTimestamp - iatTimestamp;
        } else {
            tokenTotalDuration = Math.max(expTimestamp - nowInitial, 3600);
        }

        function updateTimer() {
            const now = Math.floor(Date.now() / 1000);
            const remaining = expTimestamp - now;
            const progressBar = document.getElementById('lifetime-progress');
            const display = document.getElementById('lifetime-display');
            const autoRefreshEnabled = document.getElementById('auto-refresh-toggle').checked;

            // Trigger auto-refresh when remaining lifetime is <= 120 seconds (2 mins)
            if (autoRefreshEnabled && remaining <= 120 && !isRefreshing) {
                const log = document.getElementById('status-log');
                log.innerText = "Auto-Refresh Triggered (<= 2 minutes remaining)...";
                executeTokenRefresh();
            }

            if (remaining <= 0) {
                display.innerText = "EXPIRED";
                display.style.color = "var(--danger)";
                progressBar.style.width = "0%";
                progressBar.style.backgroundColor = "var(--danger)";
                clearInterval(timerInterval);
                return;
            }

            const percentage = Math.min(Math.max((remaining / tokenTotalDuration) * 100, 0), 100);
            progressBar.style.width = `${percentage}%`;

            if (percentage > 40) {
                progressBar.style.backgroundColor = "var(--accent-yellow)";
                display.style.color = "var(--accent-yellow)";
            } else if (percentage > 15) {
                progressBar.style.backgroundColor = "var(--accent-amber)";
                display.style.color = "var(--accent-amber)";
            } else {
                progressBar.style.backgroundColor = "var(--danger)";
                display.style.color = "var(--danger)";
            }

            const hrs = String(Math.floor(remaining / 3600)).padStart(2, '0');
            const mins = String(Math.floor((remaining % 3600) / 60)).padStart(2, '0');
            const secs = String(remaining % 60).padStart(2, '0');
            display.innerText = `${hrs}:${mins}:${secs}`;
        }

        updateTimer();
        timerInterval = setInterval(updateTimer, 1000);
    }

    // Listen for manual inputs to calculate token lifetime in real time
    document.getElementById('refresh-token-input').addEventListener('input', function(e) {
        const inputVal = e.target.value.trim();
        const jwtPayload = parseJwt(inputVal);

        if (jwtPayload && jwtPayload.exp) {
            const expDate = new Date(jwtPayload.exp * 1000);
            document.getElementById('expiration-display').innerText = expDate.toLocaleTimeString();
            startLifetimeTracker(jwtPayload.exp, jwtPayload.iat);
        }
    });

    // Execute token refresh operation across available fallback endpoints
    async function executeTokenRefresh() {
        if (isRefreshing) return;
        isRefreshing = true;

        const refreshTokenInput = document.getElementById('refresh-token-input').value.trim();
        const log = document.getElementById('status-log');
        const badge = document.getElementById('status-badge');
        const btn = document.getElementById('refresh-btn');

        if (!refreshTokenInput) {
            log.innerText = "Error: Please enter a refresh token.";
            log.className = "log error";
            isRefreshing = false;
            return;
        }

        btn.disabled = true;
        badge.innerText = "Refreshing...";
        badge.className = "status-badge active";
        log.innerText = "Authenticating with backend service...";
        log.className = "log";

        let successPayload = null;
        let successfulRoute = "";

        const headers = { "Content-Type": "application/json" };
        if (currentBearerToken) {
            headers["Authorization"] = `Bearer ${currentBearerToken}`;
        }

        for (const route of ENDPOINTS) {
            try {
                log.innerText = `Attempting fallback endpoint: ${route}`;
                const response = await fetch(`${BASE_URL}${route}`, {
                    method: "POST",
                    headers: headers,
                    body: JSON.stringify({ refresh_token: refreshTokenInput })
                });

                if (response.ok) {
                    successPayload = await response.json();
                    successfulRoute = route;
                    break;
                }
            } catch (err) {
                // Continue attempting redundant endpoints
            }
        }

        btn.disabled = false;
        isRefreshing = false;

        if (successPayload) {
            log.innerText = `Success: Token issued via ${successfulRoute}`;
            log.className = "log success";
            badge.innerText = "Active";

            currentPayloadObj = successPayload;
            document.getElementById('json-output').innerText = JSON.stringify(successPayload, null, 2);
            document.getElementById('active-route-display').innerText = successfulRoute;

            // SWAP TOKEN: Replaces textarea input with newly returned refresh token
            if (successPayload.refresh_token) {
                document.getElementById('refresh-token-input').value = successPayload.refresh_token;
            }

            if (successPayload.bearer) {
                currentBearerToken = successPayload.bearer;
                const payload = parseJwt(successPayload.bearer);
                
                if (payload && payload.exp) {
                    const expDate = new Date(payload.exp * 1000);
                    document.getElementById('expiration-display').innerText = expDate.toLocaleTimeString();

                    if (payload.iat) {
                        const totalSecs = payload.exp - payload.iat;
                        const hrs = Math.floor(totalSecs / 3600);
                        const mins = Math.floor((totalSecs % 3600) / 60);
                        document.getElementById('output-lifetime-display').innerText = `${hrs}h ${mins}m (${totalSecs}s)`;
                    } else {
                        document.getElementById('output-lifetime-display').innerText = expDate.toLocaleTimeString();
                    }

                    startLifetimeTracker(payload.exp, payload.iat);
                } else {
                    document.getElementById('expiration-display').innerText = "No exp claim";
                    document.getElementById('output-lifetime-display').innerText = "Unlimited";
                    document.getElementById('lifetime-display').innerText = "Unlimited";
                    document.getElementById('lifetime-progress').style.width = "100%";
                }
            }
        } else {
            log.innerText = "Error: Refresh failed across all fallback endpoints.";
            log.className = "log error";
            badge.innerText = "Failed";
            badge.className = "status-badge";
        }
    }

    // Auto-refresh state notification
    document.getElementById('auto-refresh-toggle').addEventListener('change', function(e) {
        const log = document.getElementById('status-log');
        if (e.target.checked) {
            log.innerText = "Auto-Refresh enabled (Triggers automatically when token lifetime <= 2 minutes).";
            log.className = "log success";
        } else {
            log.innerText = "Auto-Refresh disabled.";
            log.className = "log";
        }
    });

    // Copy Response JSON to Clipboard
    function copyResponse() {
        const text = document.getElementById('json-output').innerText;
        document.execCommand('copy');
        const log = document.getElementById('status-log');
        log.innerText = "JSON payload copied to clipboard!";
        log.className = "log success";
    }

    // Download Response JSON as File
    function downloadResponse() {
        if (!currentPayloadObj) {
            const log = document.getElementById('status-log');
            log.innerText = "Error: No JSON response available to download.";
            log.className = "log error";
            return;
        }

        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(currentPayloadObj, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `tokens_${Date.now()}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();

        const log = document.getElementById('status-log');
        log.innerText = "JSON response downloaded!";
        log.className = "log success";
    }
</script>
</body>
</html>
