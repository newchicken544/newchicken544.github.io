<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NASA WiFi Speed Test</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .app-container {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background-color: #000000;
    }

    /* Top Stats Header */
    .stats-header {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      padding: 40px 20px 25px 20px;
      background-color: #08090d;
      gap: 10px;
    }

    .stat-col {
      display: flex;
      flex-direction: column;
    }

    .stat-title {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #ffffff;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .icon-circle {
      width: 18px;
      height: 18px;
      border: 2px solid #ffffff;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 900;
      line-height: 1;
      flex-shrink: 0;
    }

    .stat-value {
      font-size: 38px;
      font-weight: 800;
      line-height: 1;
      color: #ffffff;
    }

    .stat-unit {
      font-size: 11px;
      color: #71717a;
      font-weight: 700;
      text-transform: uppercase;
      margin-top: 8px;
    }

    .upload-desc {
      font-size: 9px;
      color: #a1a1aa;
      font-weight: 800;
      line-height: 1.2;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    /* Middle Visual Display */
    .visual-section {
      background-color: #f4f4f6;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 40px 20px;
      overflow: hidden;
    }

    .radar-wrapper {
      position: relative;
      width: 380px;
      height: 380px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .concentric-svg {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
    }

    .ring-line {
      fill: none;
      stroke: #8b5cf6;
      stroke-width: 1.5;
      transition: all 0.3s ease;
    }

    .pulsing .ring-line {
      animation: auraPulse 1.8s infinite ease-in-out alternate;
    }

    @keyframes auraPulse {
      0% {
        stroke: #6d28d9;
        opacity: 0.6;
      }
      100% {
        stroke: #a855f7;
        opacity: 1;
        filter: drop-shadow(0 0 6px #a855f7);
      }
    }

    /* Center Meme Container */
    .meme-box {
      width: 155px;
      height: 230px;
      background-color: #000000;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .meme-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .aura-label {
      position: absolute;
      bottom: 25px;
      z-index: 3;
      color: #8b5cf6;
      font-weight: 800;
      font-size: 18px;
      letter-spacing: 1px;
      text-shadow: 0 0 10px rgba(139, 92, 246, 0.5);
    }

    /* Bottom Section Banner */
    .bottom-section {
      background-color: #000000;
      padding: 45px 20px;
      text-align: center;
    }

    .bottom-section h1 {
      font-size: 34px;
      font-weight: 900;
      letter-spacing: 1.5px;
      color: #ffffff;
      text-transform: uppercase;
      line-height: 1.25;
    }

    .action-btn {
      margin-top: 20px;
      padding: 10px 24px;
      background-color: #8b5cf6;
      color: #ffffff;
      border: none;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1px;
      cursor: pointer;
      text-transform: uppercase;
      transition: transform 0.1s, background-color 0.2s;
    }

    .action-btn:hover {
      background-color: #7c3aed;
      transform: scale(1.04);
    }

    @media (max-width: 480px) {
      .stats-header {
        padding: 25px 12px 15px 12px;
      }
      .stat-value {
        font-size: 26px;
      }
      .radar-wrapper {
        width: 300px;
        height: 300px;
      }
      .meme-box {
        width: 125px;
        height: 185px;
      }
      .bottom-section h1 {
        font-size: 26px;
      }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Audio File -->
    <audio id="auraSound" src="aura-ego.mp3" preload="auto"></audio>

    <!-- Top Stats Header -->
    <div class="stats-header">
      <div class="stat-col">
        <div class="stat-title">
          <span class="icon-circle"></span> PING
        </div>
        <div class="stat-value" id="ping-val">0</div>
        <div class="stat-unit">MS</div>
      </div>

      <div class="stat-col">
        <div class="stat-title">
          <span class="icon-circle">&#x2193;</span> DOWNLOAD
        </div>
        <div class="stat-value" id="download-val">4000.00</div>
        <div class="stat-unit">TBS</div>
      </div>

      <div class="stat-col">
        <div class="stat-title">
          <span class="icon-circle">&#x2191;</span> UPLOAD
        </div>
        <div class="upload-desc">YOUR MOMS PAYCHECK IF SHE WORKED AT NASA</div>
        <div class="stat-value" id="upload-val">aka 4B</div>
        <div class="stat-unit">TBS</div>
      </div>
    </div>

    <!-- Middle Graphic Display -->
    <div class="visual-section">
      <div class="radar-wrapper pulsing" id="radar">
        <svg class="concentric-svg" viewBox="0 0 200 200">
          <circle class="ring-line" cx="100" cy="100" r="42" />
          <circle class="ring-line" cx="100" cy="100" r="49" />
          <circle class="ring-line" cx="100" cy="100" r="56" />
          <circle class="ring-line" cx="100" cy="100" r="63" />
          <circle class="ring-line" cx="100" cy="100" r="70" />
          <circle class="ring-line" cx="100" cy="100" r="77" />
          <circle class="ring-line" cx="100" cy="100" r="84" />
          <circle class="ring-line" cx="100" cy="100" r="91" />
          <circle class="ring-line" cx="100" cy="100" r="98" />
        </svg>

        <!-- Meme Image -->
        <div class="meme-box">
          <img src="face.png" alt="Aura Trollface" onerror="this.src='face.jpg';" />
        </div>

        <div class="aura-label">+ AURA</div>
      </div>

      <button class="action-btn" onclick="startTest()">RE-TEST SPEED</button>
    </div>

    <!-- Bottom Text Banner -->
    <div class="bottom-section">
      <h1>YOUR WIFI IS<br>NASA WIFI</h1>
    </div>
  </div>

  <script>
    const sound = document.getElementById('auraSound');

    function playSound() {
      sound.currentTime = 0;
      sound.play().catch(err => console.log("Audio waiting for interaction:", err));
    }

    function startTest() {
      playSound();

      const pingEl = document.getElementById('ping-val');
      const dlEl = document.getElementById('download-val');
      const ulEl = document.getElementById('upload-val');

      let ping = Math.floor(Math.random() * 40) + 10;
      pingEl.innerText = ping;
      
      const pingTimer = setInterval(() => {
        ping -= 2;
        if (ping <= 0) {
          ping = 0;
          clearInterval(pingTimer);
        }
        pingEl.innerText = ping;
      }, 40);

      let download = 0;
      dlEl.innerText = "0.00";
      const dlTimer = setInterval(() => {
        download += 160;
        if (download >= 4000) {
          download = 4000;
          clearInterval(dlTimer);
          dlEl.innerText = "4000.00";
        } else {
          dlEl.innerText = download.toFixed(2);
        }
      }, 30);

      ulEl.innerText = "...";
      setTimeout(() => {
        ulEl.innerText = "aka 4B";
      }, 900);
    }
  </script>
</body>
</html>
